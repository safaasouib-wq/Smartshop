services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: smartshop
      POSTGRES_DB: smartshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code

volumes:
  pgdata:
