# Configuration SonarCloud — analyse du backend (Python/FastAPI).
# Projet séparé du frontend pour avoir des métriques de qualité indépendantes.
#
# ⚠️ Remplacer "TON_ORG_SONARCLOUD" par la clé d'organisation réelle une fois
#    le projet créé sur https://sonarcloud.io (Analyze new project → import
#    depuis GitHub). La clé s'affiche dans Administration → Organization.

sonar.projectKey=safaasouib-wq_Smartshop-backend
sonar.organization=TON_ORG_SONARCLOUD

sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/*.db,**/reports/**

# Rapport de couverture généré par pytest-cov (voir ci-cd.yml → job backend-tests)
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.version=3.12
