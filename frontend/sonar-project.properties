# Configuration SonarCloud — analyse du frontend (React/Vite).
# Projet séparé du backend pour avoir des métriques de qualité indépendantes.
#
# ⚠️ Remplacer "TON_ORG_SONARCLOUD" par la clé d'organisation réelle une fois
#    le projet créé sur https://sonarcloud.io (Analyze new project → import
#    depuis GitHub). La clé s'affiche dans Administration → Organization.

sonar.projectKey=safaasouib-wq_Smartshop-frontend
sonar.organization=TON_ORG_SONARCLOUD

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/reports/**,**/*.test.jsx

# Rapport de couverture généré par vitest (voir ci-cd.yml → job frontend-tests)
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
