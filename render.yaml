# Blueprint Render — déploie tout en un clic : "New +" → "Blueprint" → sélectionner ce repo.
# Doc : https://render.com/docs/infrastructure-as-code
#
# Crée 3 ressources, toutes en plan gratuit :
#   1. smartshop-db       — base PostgreSQL managée
#   2. smartshop-backend  — API FastAPI (Docker)
#   3. smartshop-frontend — vitrine + dashboard (site statique React, build Vite)
#
# ⚠️ Après le premier déploiement, dans le dashboard Render → smartshop-backend → Environment,
#    renseigner manuellement (marqués sync:false ci-dessous, jamais commités) :
#      - LLM_API_KEY (console.groq.com)
#      - TELEGRAM_BOT_TOKEN (@BotFather)
#      - TELEGRAM_COMMERCANT_CHAT_ID (optionnel)
#
# ⚠️ Les routes de smartshop-frontend pointent vers l'URL du backend. Si Render ajoute un
#    suffixe au nom (ex: smartshop-backend-ab12), mettre à jour ces routes avec l'URL réelle
#    (Dashboard → smartshop-frontend → Redirects/Rewrites).

databases:
  - name: smartshop-db
    plan: free
    databaseName: smartshop
    user: smartshop

services:
  # ── API FastAPI ────────────────────────────────────────────────────────────
  - type: web
    name: smartshop-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartshop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: MAX_HISTORY_MESSAGES
        value: "12"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_TRANSCRIPTION_MODEL
        value: whisper-large-v3
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_COMMERCANT_CHAT_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  # ── Vitrine + dashboard (site statique) ─────────────────────────────────────
  - type: web
    name: smartshop-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Proxy transparent des appels API/webhook/doc vers le backend (même origine
      # côté navigateur → pas de souci CORS). L'ORDRE compte : ces règles doivent
      # précéder le fallback SPA ci-dessous.
      - type: rewrite
        source: /api/*
        destination: https://smartshop-backend.onrender.com/api/*
      - type: rewrite
        source: /webhook/*
        destination: https://smartshop-backend.onrender.com/webhook/*
      - type: rewrite
        source: /docs
        destination: https://smartshop-backend.onrender.com/docs
      - type: rewrite
        source: /openapi.json
        destination: https://smartshop-backend.onrender.com/openapi.json
      # Fallback SPA : /admin, /suivi, / → index.html (routage géré par main.jsx)
      - type: rewrite
        source: /*
        destination: /index.html
