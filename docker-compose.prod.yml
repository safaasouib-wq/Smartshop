services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartshop}
      POSTGRES_DB: smartshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/safaasouib-wq/smartshop/backend:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/safaasouib-wq/smartshop/frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
