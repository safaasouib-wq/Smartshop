name: CI/CD

# Build → Test → Deploy (publication des images sur GitHub Container Registry)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployer:
        description: "Publier les images sur ghcr.io à la fin de ce run ?"
        type: boolean
        default: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ── Vérifie la présence des secrets optionnels (secrets indisponible dans un `if:` de job) ──
  check-secrets:
    name: Vérifier les secrets configurés
    runs-on: ubuntu-latest
    outputs:
      sonar_configure: ${{ steps.check.outputs.sonar_configure }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "sonar_configure=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  # ── SÉCURITÉ : scan de secrets (bloque le déploiement en cas de fuite) ────
  gitleaks:
    name: Sécurité — gitleaks (scan de secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publie les résultats dans l'onglet Security
      pull-requests: write     # commente la PR en cas de secret détecté
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # historique complet requis pour scanner tous les commits

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 1 : BUILD + TEST backend ────────────────────────────────────────
  backend-build:
    name: Backend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier que l'application démarre (import)
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from app.main import app; print('OK', app.title)"

  backend-tests:
    name: Backend — tests
    needs: backend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # publie le rapport de tests en Check Run
      pull-requests: write # commente le résumé sur la PR
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests pytest (JUnit + couverture)
        run: |
          pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov --cov-report=term

      - name: Rapport de tests → résumé + Check Run
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: backend/reports/junit.xml
          check_name: 'Résultats — Backend'
          detailed_summary: true
          include_passed: true

      - name: Rapport de couverture → résumé
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/reports/coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Ajouter la couverture au résumé du job
        if: always()
        working-directory: ${{ github.workspace }}
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publier les rapports (JUnit + couverture)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-backend
          path: backend/reports/
          if-no-files-found: ignore
          retention-days: 30

  # ── STAGE 1 bis : BUILD frontend ──────────────────────────────────────────
  frontend-build:
    name: Frontend — build Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Publier le bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  frontend-tests:
    name: Frontend — tests
    needs: frontend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # publie le rapport de tests en Check Run
      pull-requests: write # commente le résumé sur la PR
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests vitest (JUnit + couverture)
        run: npm run test:ci

      - name: Rapport de tests → résumé + Check Run
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: frontend/reports/junit.xml
          check_name: 'Résultats — Frontend'
          detailed_summary: true
          include_passed: true

      - name: Rapport de couverture → résumé
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: frontend/reports/coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Ajouter la couverture au résumé du job
        if: always()
        working-directory: ${{ github.workspace }}
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publier les rapports (JUnit + couverture)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-frontend
          path: frontend/reports/
          if-no-files-found: ignore
          retention-days: 30

  # ── QUALITÉ : analyse SonarCloud (2 projets séparés backend/frontend) ─────
  sonarcloud-backend:
    name: Qualité — SonarCloud (Backend)
    needs: [check-secrets, backend-tests]
    runs-on: ubuntu-latest
    if: needs.check-secrets.outputs.sonar_configure == 'true'   # ignoré tant que SONAR_TOKEN n'est pas configuré (voir README)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis par l'analyse Sonar

      - name: Récupérer le rapport de couverture (job backend-tests)
        uses: actions/download-artifact@v4
        with:
          name: rapports-backend
          path: backend/reports

      - name: Analyse SonarCloud
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonarcloud-frontend:
    name: Qualité — SonarCloud (Frontend)
    needs: [check-secrets, frontend-tests]
    runs-on: ubuntu-latest
    if: needs.check-secrets.outputs.sonar_configure == 'true'   # ignoré tant que SONAR_TOKEN n'est pas configuré (voir README)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis par l'analyse Sonar

      - name: Récupérer le rapport de couverture (job frontend-tests)
        uses: actions/download-artifact@v4
        with:
          name: rapports-frontend
          path: frontend/reports

      - name: Analyse SonarCloud
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── STAGE 2 : DEPLOY (manuel) — images Docker vers ghcr.io ────────────────
  # Se déclenche uniquement via "Run workflow" dans l'onglet Actions (jamais
  # automatiquement sur un push/PR), avec la case "deployer" cochée (défaut).
  publier-images:
    name: Deploy — images Docker (ghcr.io)
    runs-on: ubuntu-latest
    needs: [gitleaks, backend-tests, frontend-tests]
    if: github.event_name == 'workflow_dispatch' && inputs.deployer == true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - composant: backend
            contexte: ./backend
          - composant: frontend
            contexte: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules (ghcr.io l'exige)
        id: image
        run: echo "nom=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.composant }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.nom }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}

      - name: Récapitulatif
        run: |
          {
            echo "### Image publiée : \`${{ matrix.composant }}\`"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
